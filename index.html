<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tipzy</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#12302b;--mut:#5d7771;--line:#d5e2de;--acc:#e8590c;--teal:#0f766e;--bad:#c92a2a;--good:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f1c;--card:#15302b;--ink:#e6f2ee;--mut:#93b0a9;--line:#244640;--acc:#ff8a3d;--teal:#2dd4bf;--good:#69db7c;--bad:#ff8787;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1f1c;--card:#15302b;--ink:#e6f2ee;--mut:#93b0a9;--line:#244640;--acc:#ff8a3d;--teal:#2dd4bf;--good:#69db7c;--bad:#ff8787;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
nav{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav b{font-weight:800;margin-right:10px;align-self:center;color:var(--teal);white-space:nowrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
main{max-width:1050px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.k{font-size:28px;font-weight:800}.s{color:var(--mut);font-size:13px}
h2{margin:18px 0 8px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
.good{color:var(--good)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
input,select,textarea{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{padding:10px 0;border-bottom:1px solid var(--line)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);margin:2px 3px 0 0}
/* owner */
.hero{display:flex;gap:20px;flex-wrap:wrap;align-items:center;padding:20px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#0f766e,#164e63 60%,#7c2d12)}
.hero h2{margin:0;color:#fff}.hero .big{font-size:44px;font-weight:800;line-height:1}
.ring{width:130px;height:130px;position:relative;flex:none}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.2)}.ring .fg{stroke:#ffd43b;stroke-dasharray:327;animation:rg 1.2s ease-out both}@keyframes rg{from{stroke-dashoffset:327}}
.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:32px;line-height:1}.ring b small{font-size:11px;font-weight:400;opacity:.85}
.kt{display:flex;gap:12px;align-items:center}.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--line)}
.dl{font-size:12px;font-weight:600}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));margin-top:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;transition:transform .15s}.seg button:active{transform:scale(.93)}.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.ins{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ins:last-child{border:0}
.av2{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex:none}
.fbk{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.lr{display:grid;grid-template-columns:24px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
@media(max-width:520px){.hero{justify-content:center;text-align:center}.hero .big{font-size:38px}}
/* customer phone */
.stage{display:flex;justify-content:center}
.phone{width:min(380px,100%);min-height:640px;border-radius:34px;position:relative;overflow:hidden;background:linear-gradient(160deg,#0f766e,#164e63 55%,#312e81);color:#fff;padding:22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:fl 9s ease-in-out infinite alternate}
.b1{width:220px;height:220px;background:#a78bfa;top:-50px;right:-60px}.b2{width:200px;height:200px;background:#2dd4bf;bottom:20px;left:-70px;animation-delay:-4s}
@keyframes fl{to{transform:translate(30px,40px) scale(1.2)}}
.glass{position:relative;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;padding:18px;margin-bottom:14px}
.scr{position:relative}.scr.enter{animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateY(14px)}}
.av{width:92px;height:92px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,#c7f9ee,#2dd4bf);box-shadow:0 0 0 5px rgba(255,255,255,.35);animation:pu 2.6s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 0 12px rgba(255,255,255,.1)}}
.ctr{text-align:center}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amt{padding:9px 0;min-width:0;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:.2s}
.amt:hover{transform:translateY(-2px)}.amt.on{background:#fff;color:#0f766e;transform:scale(1.06)}
.phone input,.phone textarea{width:100%;background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff;margin-top:8px}
.phone ::placeholder{color:rgba(255,255,255,.7)}
.quote{min-height:64px;font-size:19px;font-weight:600;line-height:1.4;margin:4px 6px 16px;text-align:center}.quote.typing::after{content:'|';margin-left:2px;opacity:.8}.amt:active,.go:active,.chip:active,.stars span:active{transform:scale(.92)!important}.go{transition:transform .15s,filter .2s}.go:hover:not(:disabled){filter:brightness(1.08)}.amt.on{animation:bump .3s ease}@keyframes bump{50%{transform:scale(1.16)}}.stars span.on{animation:bump .3s ease}
.go{width:100%;padding:11px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,#34d399,#22d3ee);color:#053b3a;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.go:disabled{opacity:.45}
.stars{display:flex;justify-content:center;gap:6px;font-size:40px}
.stars span{cursor:pointer;color:rgba(255,255,255,.4);transition:.15s}.stars span.on{color:#ffd43b;transform:scale(1.15)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{padding:7px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:#fff;color:#0f766e}
.upi{background:#fff;color:#12302b;border-radius:18px;padding:16px;text-align:center}
.tick{font-size:60px;animation:pop .5s}@keyframes pop{from{transform:scale(0)}}
.qr{width:120px;height:120px;margin:10px auto;background:conic-gradient(#12302b 25%,#fff 0 50%,#12302b 0 75%,#fff 0);background-size:20px 20px;border:8px solid #fff;border-radius:6px}
.note{font-size:12px;color:var(--mut)}.demo{max-width:380px;margin:0 auto 12px}.demo summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav id="nav"><b>Tipzy</b></nav>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const TAGS=['Food taste','Service speed','Staff behaviour','Cleanliness','Ambience','Value for money'];
const QUOTES={10:'Thanks for the coffee ☕',20:'Thanks for the quick snack 🍪',30:'Thanks for the breakfast 🍳',50:'Thanks for making our meal unforgettable ❤️'};
const CUSTOM='Every rupee means the world to someone working hard for you 🙏';
const R=[];
const reviews=[],tips=[];
const st={v:'adm',rid:null,wid:null,tok:null,ready:1,step:'tip',amt:0,rating:0,tags:[],txt:'',msg:''};
const DEMO=false;

const SB_URL='https://nwgxzvvovtzleztnqgup.supabase.co',SB_KEY='sb_publishable_jO0z0QH5kE9SDvcJzQmjzg_SGhj3V-L';
const rpc=async(fn,args)=>{const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null};
const days=c=>Math.max(0,14-Math.floor((Date.now()-new Date(c))/864e5)),mapW=w=>({id:w.id,n:w.name,e:w.emoji,u:w.upi_id,wt:w.waiter_token,tt:w.tip_token});
const fail=()=>{st.v='bad';st.lock='bad';st.ready=1;render()};
async function load(){const t=st.tok;let d;
 if(st.lock=='cust'){d=await rpc('get_tip_page',{p_tip:t});if(!d)return fail();R.splice(0,R.length,{id:'r',name:d.restaurant,g:d.google_link,w:[{id:d.waiter_id,n:d.name,e:d.emoji,u:d.upi_id,tt:t}]});st.rid='r';st.wid=d.waiter_id}
 else if(st.lock=='own'){d=await rpc('get_owner_data',{p_owner:t});if(!d)return fail();const r=d.restaurant;R.splice(0,R.length,{id:r.id,name:r.name,g:r.google_link,w:d.waiters.map(mapW)});
  reviews.splice(0,reviews.length,...d.reviews.map(v=>({uid:v.id,rid:r.id,w:v.waiter_id,r:v.rating,tags:v.tags||[],t:v.comment||'(no comment)',d:days(v.created_at),done:v.handled})));
  tips.splice(0,tips.length,...d.tips.map(x=>({w:x.waiter_id,a:x.amount,d:days(x.created_at),v:true})));st.rid=r.id}
 else if(st.lock=='wait'){d=await rpc('get_waiter_data',{p_waiter:t});if(!d)return fail();const w=d.waiter;
  R.splice(0,R.length,{id:'r',name:d.restaurant,g:'',w:d.team.map(x=>x.id==w.id?{...mapW(w),wt:t}:{id:x.id,n:'',e:'',u:''})});
  reviews.splice(0,reviews.length,...d.reviews.map(v=>({rid:'r',w:w.id,r:v.rating,tags:v.tags||[],t:v.comment||'',d:days(v.created_at)})));
  tips.splice(0,tips.length,...d.tips.map(x=>({uid:x.id,w:w.id,a:x.amount,d:days(x.created_at),v:x.verified})),...d.team.filter(x=>x.id!=w.id).map(x=>({w:x.id,a:x.total,d:0,v:true})));st.rid='r';st.wid=w.id}
 st.ready=1}
const BASE=location.href.split('#')[0],lk=(k,id)=>BASE+'#'+k+'-'+id,SK='tipqr1';let noSave=0;
const saveS=()=>{if(noSave)return;try{localStorage.setItem(SK,JSON.stringify({R,reviews,tips}))}catch(e){}};
const loadS=()=>{try{const d=JSON.parse(localStorage.getItem(SK)||'null');if(d&&d.R){R.splice(0,R.length,...d.R);reviews.splice(0,reviews.length,...d.reviews);tips.splice(0,tips.length,...d.tips)}}catch(e){}};
const copyH=()=>app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.copy)}catch(e){}const o=b.textContent;b.textContent='Copied ✓';setTimeout(()=>{b.textContent=o},1500)});
const upiLink=w=>'upi://pay?pa='+encodeURIComponent(w.u)+'&pn='+encodeURIComponent(w.n)+'&am='+st.amt+'&cu=INR&tn='+encodeURIComponent('Tip for '+w.n);
const $=s=>document.querySelector(s),app=$('#app');
const views=[['cust','Customer (QR scan)'],['own','Owner dashboard'],['wait','Waiter dashboard'],['adm','Super admin'],['plan','Business plan']];
function nav(){$('#nav').innerHTML='<b>Tipzy</b>'}
const rest=()=>R.find(r=>r.id==st.rid),allW=()=>R.flatMap(r=>r.w.map(w=>({...w,rid:r.id,rn:r.name})));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function health(rs){if(!rs.length)return 0;const p=rs.filter(x=>x.r>=4).length/rs.length;return Math.round(avg(rs.map(x=>x.r))/5*70+p*30)}
function line(vals,w=620,h=170){const mn=Math.min(...vals)-.2,mx=Math.max(...vals)+.2,x=i=>20+i*(w-40)/(vals.length-1),y=v=>h-20-(v-mn)/(mx-mn)*(h-40);
 const p=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Rating trend"><polyline fill="none" stroke="var(--teal)" stroke-width="3" points="${p}"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--acc)"><title>${v.toFixed(2)}</title></circle>`).join('')}<text x="20" y="14" fill="var(--mut)" font-size="11">${mx.toFixed(1)}</text><text x="20" y="${h-4}" fill="var(--mut)" font-size="11">${mn.toFixed(1)}</text></svg>`}
/* CUSTOMER */
const IDLE='Tap an amount and see what your kindness means 💛',LBL=['Tap a star','Very bad','Poor','Okay','Good','Excellent!'];
const payLbl=(n,a)=>`Make ${n}’s day ❤️${a?' · ₹'+a:''}`;
let tw;function typeIt(el,t){clearInterval(tw);const c=[...t];let i=0;el.textContent='';el.classList.add('typing');tw=setInterval(()=>{el.textContent=c.slice(0,++i).join('');if(i>=c.length){clearInterval(tw);el.classList.remove('typing')}},24)}
function cust(){const r=rest(),w=r.w.find(x=>x.id==st.wid)||r.w[0];st.wid=w.id;let h=`${DEMO&&!st.lock?`<details class="demo"><summary class="s">Demo only: pick which QR card was scanned</summary><div class="row" style="margin-top:8px"><select id="sr">${R.filter(x=>x.w.length).map(x=>`<option value="${x.id}" ${x.id==st.rid?'selected':''}>${x.name}</option>`).join('')}</select><select id="sw">${r.w.map(x=>`<option value="${x.id}" ${x.id==w.id?'selected':''}>${x.n}</option>`).join('')}</select></div></details>`:''}<div class="stage"><div class="phone"><i class="blob b1"></i><i class="blob b2"></i><div class="scr ${(()=>{const e=st.last!=st.step;st.last=st.step;return e?'enter':''})()}" id="sc">`;
 if(st.step=='tip'){const q=st.amt?(QUOTES[st.amt]||CUSTOM):'Tap an amount and see what your kindness means 💛';const isC=st.amt&&!QUOTES[st.amt];
  h+=`<div class="ctr s" style="color:#fff;opacity:.85;margin-bottom:10px">${r.name}</div><div class="av">${w.e}</div><div class="ctr" style="margin-bottom:14px"><div style="font-size:24px;font-weight:800">Hi, I’m ${w.n} 👋</div><div style="opacity:.9">I’m serving you today.</div><div style="margin-top:8px;font-size:15px;opacity:.95">A small tip from you helps me care for my family. Thank you for making my day. 🙏</div></div>
  <div class="glass"><div class="amts">${[10,20,30,50].map(a=>`<button class="amt ${st.amt==a?'on':''}" data-a="${a}">₹${a}</button>`).join('')}</div><input id="ci" type="number" min="1" inputmode="numeric" placeholder="Or enter your own amount ₹" value="${isC?st.amt:''}"></div>
  <div class="quote" id="q" data-t="${q}">${q}</div><button class="go" id="pay" ${st.amt?'':'disabled'}>${payLbl(w.n,st.amt)}</button>`}
 else if(st.step=='thx'){h+=`<div class="glass ctr"><div class="tick">💛</div><h2 style="margin:6px 0">Almost there</h2><p>${w.n} will receive your ₹${st.amt} directly. Your kindness truly makes a difference.</p><a class="go" target="_top" rel="noopener" style="display:block;text-decoration:none" href="${upiLink(w)}">Send ₹${st.amt} with love ❤️</a><p style="margin:12px 0 6px">Or pay manually to <b>${w.u}</b></p><button class="chip" id="cp">Copy UPI ID</button></div><div class="glass ctr"><p>Your review is the lifeline of ${r.name}. It takes just 30 seconds and means a lot to every person who served you.</p><button class="go" id="rv">Leave a review</button></div>`}
 else if(st.step=='rev'){h+=`<div class="ctr" style="font-size:22px;font-weight:800;margin-bottom:10px">${r.name}</div><div class="glass ctr"><div class="stars">${[1,2,3,4,5].map(i=>`<span data-s="${i}" class="${i<=st.rating?'on':''}">★</span>`).join('')}</div><div class="s" id="sl" style="color:#fff">${['Tap a star','Very bad','Poor','Okay','Good','Excellent!'][st.rating]}</div></div>
  <div class="glass"><div>What stood out?</div><div class="chips">${TAGS.map(t=>`<button class="chip ${st.tags.includes(t)?'on':''}" data-t="${t}">${t}</button>`).join('')}</div><textarea id="fx" rows="3" placeholder="Tell us more (optional)">${st.txt}</textarea></div><button class="go" id="sub" ${st.rating?'':'disabled'}>Submit</button>`}
 else{h+=`<div class="glass ctr"><div class="tick">🙏</div><h2>Thank you!</h2><p>${st.rating>=4?`Would you also share this on Google so others can find ${r.name}?`:`Your feedback went straight to the ${r.name} owner. We will make it right.`}</p>${r.g?`<a class="go" target="_top" rel="noopener" style="display:block;text-decoration:none;margin-top:8px" href="${r.g}">${st.rating>=4?'Post on Google ⭐':'Also share on Google'}</a>`:''}<button class="chip" id="again" style="margin-top:12px">Done</button></div>`}
 app.innerHTML=h+'</div></div></div>';
 const sr=$('#sr'),sw=$('#sw');if(sr)sr.onchange=e=>{st.rid=+e.target.value;st.wid=rest().w[0].id;render()};if(sw)sw.onchange=e=>{st.wid=+e.target.value;render()};
 const ci=$('#ci');const sync=()=>{app.querySelectorAll('.amt').forEach(b=>b.classList.toggle('on',+b.dataset.a==st.amt));const p=$('#pay');p.disabled=!st.amt;p.textContent=payLbl(w.n,st.amt);const q=$('#q'),t=st.amt?(QUOTES[st.amt]||CUSTOM):IDLE;if(q.dataset.t!==t){q.dataset.t=t;typeIt(q,t)}};
 app.querySelectorAll('.amt').forEach(b=>b.onclick=()=>{st.amt=+b.dataset.a;ci.value='';sync()});
 if(ci)ci.oninput=()=>{st.amt=Math.max(0,Math.floor(+ci.value));sync()};
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('#pay',()=>{rpc('create_tip',{p_tip:w.tt,p_amount:st.amt}).catch(()=>{});st.step='thx';render()});on('#cp',()=>{try{navigator.clipboard.writeText(w.u)}catch(e){}$('#cp').textContent='Copied ✓'});on('#rv',()=>{st.step='rev';st.rating=0;st.tags=[];st.txt='';render()});
 app.querySelectorAll('.stars span').forEach(x=>x.onclick=()=>{st.rating=+x.dataset.s;app.querySelectorAll('.stars span').forEach(y=>y.classList.toggle('on',+y.dataset.s<=st.rating));$('#sl').textContent=LBL[st.rating];$('#sub').disabled=false});
 app.querySelectorAll('.chips .chip').forEach(c=>c.onclick=()=>{const t=c.dataset.t;st.tags=st.tags.includes(t)?st.tags.filter(x=>x!=t):[...st.tags,t];c.classList.toggle('on')});
 on('#sub',async()=>{$('#sub').disabled=true;try{await rpc('submit_review',{p_tip:w.tt,p_rating:st.rating,p_tags:st.tags,p_comment:$('#fx').value})}catch(e){}st.step='done';render()});on('#again',()=>{st.step='tip';st.amt=0;render()})}
/* OWNER */
function own(){const r=rest(),rs=reviews.filter(x=>x.rid==st.rid),n=rs.length,pos=rs.filter(x=>x.r>=4).length,neg=rs.filter(x=>x.r<=3).length,a=avg(rs.map(x=>x.r)),hs=health(rs),N=st.rg||14;
 const roll=d=>{const x=rs.filter(y=>y.d<=d&&y.d>d-3);return x.length?avg(x.map(y=>y.r)):null};
 const pts=[];for(let d=14-N+1;d<=14;d++){const v=roll(d);if(v!=null)pts.push({d,v})}
 const lbl=d=>d==14?'Today':(14-d)+' days ago';
 const wk=rs.filter(x=>x.d>=8),pw=rs.filter(x=>x.d<8),dl=avg(wk.map(x=>x.r))-avg(pw.map(x=>x.r)),dc=wk.length-pw.length;
